<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16213A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="zhyva-192.png">
<link rel="apple-touch-icon" href="zhyva-192.png">
<title>Zhyva Voda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: one-screen phone app — header, a single scrolling view, a fixed 5-tab bar. Indigo ink on cool paper; red hanko seal only for kaizen; 8 validated series hues for life spheres. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E3E8F0; --line:#D3DAE6;
  --ink:#16213A; --muted:#5C6884; --accent:#2D47A6; --accent-soft:#DCE3F8;
  --seal:#C93A26; --good:#22865B; --warn:#B9761C; --bad:#C93A26;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --s1:#86b6ef; --s2:#3987e5; --s3:#256abf; --s4:#104281;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --shadow:0 1px 2px rgba(22,33,58,.06),0 6px 20px rgba(22,33,58,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#151D31; --sunk:#1C2640; --line:#28334F;
  --ink:#E7EBF5; --muted:#97A3BF; --accent:#90A7FF; --accent-soft:#233160;
  --seal:#F0634B; --good:#4CC28C; --warn:#E6A84A; --bad:#F0634B;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767;
  --s1:#1c5cab; --s2:#3987e5; --s3:#6da7ec; --s4:#b7d3f6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D31; --sunk:#1C2640; --line:#28334F;
  --ink:#E7EBF5; --muted:#97A3BF; --accent:#90A7FF; --accent-soft:#233160;
  --seal:#F0634B; --good:#4CC28C; --warn:#E6A84A; --bad:#F0634B;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767;
  --s1:#1c5cab; --s2:#3987e5; --s3:#6da7ec; --s4:#b7d3f6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 128px}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:6px 14px}
.top-l{display:flex;gap:10px;align-items:flex-start;min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.cloud{background:var(--good)}
.date{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.15;margin-top:4px;text-wrap:balance;overflow-wrap:anywhere}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.mission{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin-bottom:16px}
.mission b{color:var(--ink);font-weight:600}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.stack>.card:nth-child(2){animation-delay:.04s}.stack>.card:nth-child(3){animation-delay:.08s}.stack>.card:nth-child(4){animation-delay:.12s}.stack>.card:nth-child(5){animation-delay:.16s}.stack>.card:nth-child(6){animation-delay:.2s}.stack>.card:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.eyebrow .num{font-family:var(--mono);letter-spacing:0;color:var(--accent);text-transform:none}
.hero{border-color:transparent;background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.rule{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.h2{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25;margin:0;text-wrap:balance}

.task{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.task:last-of-type{border-bottom:0}
.task input{flex:1;min-width:0;border:0;background:transparent;padding:8px 2px;font-weight:600;font-size:16px;outline:none}
.task input::placeholder{color:var(--muted);font-weight:500}
.task.done input{text-decoration:line-through;color:var(--muted)}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;transition:all .2s;padding:0}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.done .check,.check.on{background:var(--good);border-color:var(--good);color:#fff}
.done .check svg,.check.on svg{opacity:1;transform:none}
.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none;padding:0}
.mini svg{width:17px;height:17px}
.idx{font-family:var(--mono);font-size:12px;color:var(--muted);width:14px;flex:none}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-family:var(--mono);font-size:15px;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.2em}
.hint.low{color:var(--warn);font-weight:600}

.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.habit{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);cursor:pointer;text-align:left;font-size:13.5px;font-weight:600;min-width:0;transition:all .2s}
.habit span.l{min-width:0;overflow-wrap:anywhere}
.habit.on{background:var(--accent-soft);border-color:var(--accent)}
.habit .tick{width:18px;height:18px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.habit.on .tick{background:var(--accent);border-color:var(--accent)}
.habit.on .tick::after{content:"";width:8px;height:4px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.05)}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.app-l{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:14px;text-decoration:none;font-size:12.5px;font-weight:600;text-align:center;background:var(--surface);transition:transform .15s;min-width:0;overflow-wrap:anywhere}
.app-l:active{transform:scale(.96)}
.app-l i{font-style:normal;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-size:14px}

.timer{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--sunk)}
.ring .rb{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
.ring.over .rb{stroke:var(--warn)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:22px}
.tbody{min-width:0;flex:1}
.tname{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .12s,background .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent}
.btn.block{width:100%;padding:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>.btn{flex:1}

.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field:first-child{margin-top:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
textarea,.in{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:11px 12px;outline:none;resize:vertical;min-width:0}
textarea:focus,.in:focus{box-shadow:0 0 0 3px var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .field{margin-top:12px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums .in,.in.num{font-family:var(--mono);text-align:center;font-size:17px}
.numline{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:nowrap}

.kz-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:26px;height:8px;border-radius:4px;border:0;background:var(--sunk);cursor:pointer;padding:0}
.dots button.fill{background:var(--accent-soft)}
.dots button.cur{background:var(--accent)}
.kq{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.25;text-wrap:balance;margin:6px 0 14px}
.kstep{animation:slide .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:.3;transform:translateX(18px)}to{opacity:1;transform:none}}
.kstep.back{animation-name:slideb}
@keyframes slideb{from{opacity:.3;transform:translateX(-18px)}to{opacity:1;transform:none}}
.algo{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.algo span{font-family:var(--display);font-size:13px;color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seal{width:84px;height:84px;border-radius:14px;border:3px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-size:30px;font-weight:700;transform:rotate(-8deg);margin:6px auto 4px;letter-spacing:.05em}
.seal.stamp{animation:stamp .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{0%{transform:rotate(-8deg) scale(2.2);opacity:0}60%{transform:rotate(-8deg) scale(.92);opacity:1}100%{transform:rotate(-8deg) scale(1)}}
.done-msg{text-align:center;font-weight:700;margin-bottom:6px}

.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.yn button.on.y{background:var(--good);border-color:var(--good);color:#fff}
.yn button.on.n{background:var(--bad);border-color:var(--bad);color:#fff}

/* dreams */
.vision{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.vision::-webkit-scrollbar{display:none}
.vcard{flex:0 0 82%;scroll-snap-align:center;border-radius:18px;padding:18px;background:var(--ink);color:var(--bg);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.vcard::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:18px solid color-mix(in srgb,var(--bg) 10%,transparent)}
.vcard p{font-family:var(--display);font-weight:500;font-size:16.5px;line-height:1.35;margin:0;position:relative;z-index:1;text-wrap:pretty}
.vcard small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:700}
.closeness{display:flex;align-items:center;gap:16px}
.spheres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sph{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow);animation:rise .45s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s}
.sph:active{transform:scale(.97)}
.sph .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;min-width:0}
.sph .nm i{width:10px;height:10px;border-radius:50%;flex:none}
.sph .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sph .dr{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.sph .bot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pct{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.pct small{font-size:12px;font-weight:500;color:var(--muted)}
.mring{flex:none}
.mring circle{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.strip{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .sph{flex:0 0 132px;padding:12px;gap:6px;align-items:center;text-align:center;box-shadow:none}
.strip .sph .nm{justify-content:center;font-size:12.5px}
.gdream{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.3;text-wrap:balance;margin:4px 0 0}
.bigring{position:relative;width:170px;height:170px;margin:4px auto 6px}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bigring .lbl b{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.bigring .lbl span{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:22px;color:var(--good);pointer-events:none;animation:floatup 1.4s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.ms{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ms:last-child{border-bottom:0}
.ms span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:14px}
.ms.done span{color:var(--muted);text-decoration:line-through}
.pace{font-size:14px;background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:10px}
.pace b{font-family:var(--mono)}

/* reviews */
.due{display:flex;flex-direction:column}
.drow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .t{flex:1;min-width:0}
.drow .t b{display:block;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.drow .t small{font-size:12px;color:var(--muted)}
.qb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;display:grid;place-items:center;flex:none;padding:0}
.qb.ok{color:var(--good)}.qb.no{color:var(--bad)}
.qb svg{width:18px;height:18px}
.area{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.area-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.area-h b{font-size:16px}
.badge{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.badge.due{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--ink)}
.stagebar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stagebar div{height:100%;min-width:0;transition:flex-grow .8s}
.st0{background:var(--sunk)}.st1{background:var(--s1)}.st2{background:var(--s2)}.st3{background:var(--s3)}.st4{background:var(--s4)}
.slegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.slegend span{display:inline-flex;align-items:center;gap:5px}
.slegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.subj-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.subj-row b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj-row .badge{font-size:11px}
.sec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.sec:first-child{margin-top:0}
.topic{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.topic .tn{flex:1;min-width:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;border-radius:3px;background:var(--sunk)}
.pips i.f1{background:var(--s1)}.pips i.f2{background:var(--s2)}.pips i.f3{background:var(--s3)}.pips i.f4{background:var(--s4)}
.topic .badge{font-size:10.5px}
.flash-ok{animation:fok .8s}
@keyframes fok{30%{background:color-mix(in srgb,var(--good) 25%,transparent)}}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend2 i.sq{height:10px;width:10px;border-radius:3px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 40px;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}

#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}

.ivrun{display:flex;align-items:center;gap:12px;border:1px solid var(--c2);background:color-mix(in srgb,var(--c2) 12%,var(--surface));color:var(--ink);border-radius:16px;padding:12px 14px;width:100%;font:inherit;text-align:left;cursor:pointer}

.enp:first-of-type{border-top:0}
.enp.done .enp-t{color:var(--muted);text-decoration:line-through}
.enp-t{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;font:inherit;color:var(--ink);cursor:pointer;font-size:15px;font-weight:700}
.enp-t small{display:block;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:2px}
.enp em{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--muted)}
.uaw{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.uaw:first-of-type{border-top:0}
.uaw b{font-size:16.5px}
.uaw small{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.4}
.uaw small.ex{color:var(--ink);font-style:italic}
.uaw.done b{color:var(--good)}
.v21t{font-family:var(--display);font-size:17px;line-height:1.5;margin:6px 0 10px;font-style:italic}
.v21rs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.v21r{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:9px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:left}
.v21r small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.v21r .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--line)}
.v21r.on{border-color:var(--c3);background:color-mix(in srgb,var(--c3) 14%,var(--surface))}
.v21r.on .tick{background:var(--c3);border-color:var(--c3)}
.v21dots{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 2px}
.v21d{width:11px;height:11px;border-radius:50%;border:2px solid var(--line)}
.v21d.part{background:color-mix(in srgb,var(--c3) 45%,transparent);border-color:var(--c3)}
.v21d.full{background:var(--c3);border-color:var(--c3)}
.v21d.now{box-shadow:0 0 0 3px var(--accent-soft)}
.ewr{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ewr b{font-size:15px}.ewr small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.ewr.ok b{color:var(--good)}
.ewu{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 0}
.ewu small{display:block;color:var(--muted);font-size:12px}.ewu.done{color:var(--good);font-weight:700}
.enstat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px;text-align:center}
.enstat b{display:block;font-family:var(--mono);font-size:22px}.enstat small{color:var(--muted);font-size:11px}
/* v22: повтори НМТ */
.rprow{padding:12px 0;border-bottom:1px solid var(--line)}
.rprow:last-of-type{border-bottom:0}
.rprow .nm{display:block;width:100%;text-align:left;border:0;background:none;padding:0;font:inherit;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.rprow small{display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;font-size:12.5px;color:var(--muted);margin-top:3px}
.rprow small i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.rpl{font-weight:700;color:var(--ink)}
.rpbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rpbtns.one{grid-template-columns:1fr}
.rpbtns .btn{min-height:44px;padding:10px 8px}
.frow small.rpst{color:var(--ink);font-weight:600}
.frow small.rpst.due{color:var(--warn);font-weight:700}
.rptl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:6px}
.rps{border:1px solid var(--line);border-radius:12px;padding:8px 9px;background:var(--surface);min-width:0}
.rps b{display:block;font-family:var(--mono);font-size:12.5px;font-weight:700}
.rps small{display:block;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.rps.dn{background:color-mix(in srgb,var(--good) 16%,var(--surface));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.rps.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.rpnum{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.rpnum button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 0;font-family:var(--mono);font-size:16px;cursor:pointer}
.rpnum button.ok{border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.rpnum button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.rpnum button.ok.on{background:var(--good);border-color:var(--good);color:#fff}
#rp-err,#rp-mock,#rp-rules,#rp-today{scroll-margin-top:12px}
</style>

<script>
(() => {
'use strict';
/* ================= helpers ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const enc = encodeURIComponent;
const now = new Date();
const TODAY = keyOf(now);
const addDays = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return keyOf(d); };
const YESTERDAY = addDays(TODAY, -1);
const dmy = k => k ? k.split('-').reverse().slice(0, 2).join('.') : '—';
const dmyy = k => k ? k.split('-').reverse().join('.') : '—';
const lsGet = k => { try { const v = localStorage.getItem('pult:' + k); return v ? JSON.parse(v) : null; } catch { return null; } };
const lsSet = (k, v) => { try { const raw = JSON.stringify(v); if (localStorage.getItem('pult:' + k) === raw) return; localStorage.setItem('pult:' + k, raw); syncTouch(k); } catch {} };
const lsKeys = p => { try { return Object.keys(localStorage).filter(k => k.startsWith('pult:' + p)).map(k => k.slice(5)); } catch { return []; } };
/* ================= sync: phone ↔ computer through a private GitHub Gist ================= */
// Every change stamps its key with a time; sync merges both sides key by key, newer wins.
const SYNC_SKIP = new Set(['gdriveLast', 'route', 'timer', 'iv', 'ivMode', 'hwCache', 'uaw', 'ntfySent', 'sync', 'syncMeta']);
const SYNC_FILE = 'zhyva-voda.json', SYNC_DESC = 'Zhyva Voda — sync (private)';
const syncSkip = k => SYNC_SKIP.has(k) || k.startsWith('sync');
const syncCfg = () => { try { return JSON.parse(localStorage.getItem('pult:sync') || 'null'); } catch { return null; } };
const syncCfgSet = c => { try { localStorage.setItem('pult:sync', JSON.stringify(c)); } catch {} };
const syncOn = () => { const c = syncCfg(); return !!(c && c.token && c.gist); };
let syncMetaC = null;
const syncMeta = () => { if (!syncMetaC) { try { syncMetaC = JSON.parse(localStorage.getItem('pult:syncMeta') || '{}'); } catch { syncMetaC = {}; } } return syncMetaC; };
const syncMetaSave = () => { try { localStorage.setItem('pult:syncMeta', JSON.stringify(syncMeta())); } catch {} };
let syncPushT = null, syncBusy = false, syncAgain = false, syncRemote = null, syncState = 'off', syncErr = '';
function syncTouch(k) {
  driveTouch(k);
  if (syncSkip(k)) return;
  syncMeta()[k] = Date.now(); syncMetaSave();
  if (syncOn()) { clearTimeout(syncPushT); syncPushT = setTimeout(() => syncNow(), 2500); }
}
async function gh(c, path, opt = {}) {
  const r = await fetch('https://api.github.com' + path, Object.assign({}, opt, { cache: 'no-store', headers: Object.assign({ Authorization: 'Bearer ' + c.token, Accept: 'application/vnd.github+json' }, opt.body ? { 'Content-Type': 'application/json' } : {}, opt.headers || {}) }));
  if (r.status === 401) throw new Error('token');
  if (!r.ok && r.status !== 304) throw new Error('http ' + r.status);
  return r;
}
async function gistRead(c) {
  const r = await gh(c, '/gists/' + c.gist, { headers: syncRemote && c.etag ? { 'If-None-Match': c.etag } : {} });
  if (r.status === 304 && syncRemote) return syncRemote;
  const j = await r.json(); const f = j.files && j.files[SYNC_FILE];
  let txt = f ? f.content : '';
  if (f && f.truncated && f.raw_url) txt = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  let data = {}; try { data = JSON.parse(txt || '{}').data || {}; } catch {}
  c.etag = r.headers.get('ETag') || ''; syncCfgSet(c);
  syncRemote = { data }; return syncRemote;
}
async function gistWrite(c, data) {
  const body = JSON.stringify({ files: { [SYNC_FILE]: { content: JSON.stringify({ v: 1, at: Date.now(), data }) } } });
  const r = await gh(c, '/gists/' + c.gist, { method: 'PATCH', body });
  c.etag = r.headers.get('ETag') || ''; syncCfgSet(c); syncRemote = { data };
}
const syncTyping = () => { const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'file'; };
async function syncNow(manual) {
  const c = syncCfg(); if (!c || !c.token || !c.gist) return false;
  if (syncBusy) { syncAgain = true; return false; }
  const typing = !manual && syncTyping(); // while typing: only send, don't pull (pulling would redraw under your fingers)
  syncBusy = true; let pulled = 0;
  try {
    const remote = await gistRead(c); const meta = syncMeta(); const data = Object.assign({}, remote.data); let pushed = false;
    for (const [k, r] of Object.entries(data)) {
      if (typing || syncSkip(k) || !r || !(r.t > (meta[k] || 0))) continue;
      try { if (r.v == null) localStorage.removeItem('pult:' + k); else localStorage.setItem('pult:' + k, r.v); } catch {}
      meta[k] = r.t; pulled++;
    }
    for (const [k, t] of Object.entries(meta)) {
      if (syncSkip(k)) continue; const r = data[k];
      if (!r || t > r.t) { data[k] = { t, v: localStorage.getItem('pult:' + k) }; pushed = true; }
    }
    syncMetaSave();
    if (pushed) await gistWrite(c, data);
    if (typing) { clearTimeout(syncPushT); syncPushT = setTimeout(() => syncNow(), 5000); }
    c.last = Date.now(); syncCfgSet(c); syncState = 'ok'; syncErr = '';
  } catch (e) { syncState = 'err'; syncErr = e && e.message === 'token' ? 'The token no longer works — paste a new one.' : 'No connection — will retry.'; }
  syncBusy = false; setSync();
  if (pulled) { try { await load(); render(); } catch {} driveTouch('*'); }
  if (syncAgain) { syncAgain = false; setTimeout(() => syncNow(), 300); }
  if (manual) toast(syncState === 'ok' ? (pulled ? `Synced · ${pulled} updated` : 'Synced ✓') : syncErr);
  return syncState === 'ok';
}
async function syncConnect(token) {
  const c = { token: token.trim() }; if (!c.token) { toast('Paste the token first.'); return; }
  try {
    const me = await (await gh(c, '/user')).json(); c.login = me.login;
    const list = await (await gh(c, '/gists?per_page=100')).json();
    const g = (list || []).find(x => x.description === SYNC_DESC && x.files && x.files[SYNC_FILE]);
    if (g) { c.gist = g.id; syncCfgSet(c); syncRemote = null; await gistRead(c); closeSheet(); syncChoice(); return; }
    // first device: create the gist from this device's data
    const meta = syncMeta(), t = Date.now(), data = {};
    Object.keys(localStorage).filter(k => k.startsWith('pult:')).map(k => k.slice(5)).filter(k => !syncSkip(k)).forEach(k => { meta[k] = t; data[k] = { t, v: localStorage.getItem('pult:' + k) }; });
    syncMetaSave();
    const r = await (await gh(c, '/gists', { method: 'POST', body: JSON.stringify({ description: SYNC_DESC, public: false, files: { [SYNC_FILE]: { content: JSON.stringify({ v: 1, at: t, data }) } } }) })).json();
    c.gist = r.id; c.last = Date.now(); syncCfgSet(c); syncState = 'ok'; setSync(); closeSheet();
    toast('Connected ✓ Now paste the same token on your other device.', true);
  } catch (e) { toast(e && e.message === 'token' ? 'GitHub didn’t accept this token. Check it has the “gist” box ticked.' : 'Couldn’t reach GitHub — check the internet and try again.'); }
}
function syncChoice() {
  sheet('Which data do you keep?', `<p style="margin-top:0">The cloud already has data from your other device.</p>
    <div class="row"><button class="btn primary" data-act="syncTake">Take data from the cloud</button></div>
    <p class="rule">Choose this on the second device (e.g. the computer). Its own extra days are added, everything else comes from the cloud.</p>
    <div class="row"><button class="btn" data-act="syncGive">Keep this device’s data</button></div>
    <p class="rule">This device overwrites the cloud. Choose it only if this is your main device.</p>`);
}
async function syncStart(mode) {
  const meta = syncMeta(), t = Date.now(), remote = (syncRemote || {}).data || {};
  Object.keys(localStorage).filter(k => k.startsWith('pult:')).map(k => k.slice(5)).filter(k => !syncSkip(k)).forEach(k => { meta[k] = mode === 'give' ? t : (remote[k] ? 0 : 1); });
  syncMetaSave(); closeSheet(); syncState = 'ok'; setSync();
  await syncNow(true);
}
function syncCard() {
  const c = syncCfg();
  if (syncOn()) return `<div class="sec">Phone ↔ computer sync</div>
    <div class="rem"><span>${syncState === 'err' ? '⚠️ ' + esc(syncErr) : '✅ On'}${c.login ? ' · GitHub ' + esc(c.login) : ''}<small>${c.last ? 'last sync ' + hhmm(new Date(c.last)) + ', ' + dmy(keyOf(new Date(c.last))) : 'not synced yet'}</small></span><button class="btn" data-act="syncNow">Sync now</button></div>
    <div class="row"><button class="btn ghost no" data-act="syncOff">Turn off on this device</button></div>`;
  return `<div class="sec">Phone ↔ computer sync</div>
    <p class="rule" style="margin-top:0">Right now each device keeps its own data. Turn this on once on the phone and once on the computer — then what you do on one shows up on the other.</p>
    <ol class="notes" style="padding-left:20px;margin:6px 0">
      <li>Open <a href="https://github.com/settings/tokens/new?scopes=gist&description=Zhyva%20Voda%20sync" target="_blank" rel="noopener">this GitHub page</a> (the “gist” box is already ticked). Expiration: “No expiration”. Press “Generate token” and copy it.</li>
      <li>Paste it below on the <b>phone first</b> → Connect.</li>
      <li>Paste the same token on the computer → “Take data from the cloud”.</li></ol>
    <div class="field"><input class="in" id="sync-tok" type="password" autocomplete="off" placeholder="ghp_…"></div>
    <div class="row"><button class="btn primary" data-act="syncConnect">Connect</button></div>
    <p class="rule">Your data goes into a private gist in your own GitHub account. The token only has access to gists.</p>`;
}
setInterval(() => { if (syncOn() && document.visibilityState === 'visible') syncNow(); }, 30000);
document.addEventListener('visibilitychange', () => { if (syncOn()) syncNow(); });
/* ================= Google Drive mirror: every change → My Drive/Absidian/Zhyva Voda (Obsidian + Claude see it) ================= */
// A tiny Google Apps Script in the user's own account (drive-script.txt) receives a full snapshot and writes data.json, history/<day>.json and Today.md.
const driveSkip = k => syncSkip(k) || k.startsWith('gdrive');
const driveUrl = () => { const c = lsGet('gdrive'); return (c && c.url) || ''; };
let driveT = null, driveDirty = false, driveScript = '';
const driveScriptLoad = () => driveScript ? Promise.resolve(driveScript) : fetch('drive-script.txt', { cache: 'no-store' }).then(r => r.text()).then(t => (driveScript = t));
function driveTouch(k) {
  if (k !== '*' && driveSkip(k)) return;
  if (!driveUrl()) return;
  driveDirty = true; clearTimeout(driveT); driveT = setTimeout(() => drivePush(), 5000);
}
function driveBody() {
  const data = {};
  try {
    Object.keys(localStorage).filter(k => k.startsWith('pult:')).map(k => k.slice(5)).filter(k => !driveSkip(k)).sort().forEach(k => {
      const raw = localStorage.getItem('pult:' + k); try { data[k] = JSON.parse(raw); } catch { data[k] = raw; }
    });
  } catch {}
  const d = new Date();
  return JSON.stringify({ app: 'zhyva-voda', v: 1, at: keyOf(d) + ' ' + hhmm(d), today: keyOf(d), device: /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? 'phone' : 'computer', data });
}
async function drivePush(manual) {
  const url = driveUrl(); if (!url) return false;
  clearTimeout(driveT); driveDirty = false;
  try {
    await fetch(url, { method: 'POST', mode: 'no-cors', body: driveBody() }); // the script answers with a redirect, so the reply is unreadable — check with driveCheck()
    try { localStorage.setItem('pult:gdriveLast', String(Date.now())); } catch {}

const roundTop = (x, y, w, h, r) => { r = Math.min(r, w / 2, h); if (h <= 0) return ''; return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };

/* bars: labels[], series [{name,color,values}], stacked */
function barChart({ labels, series, h = 150, unit = '', stacked = true, every = 1 }) {
  const W = 340, L = 30, R = 6, T = 8, B = 20, ph = h - T - B, pw = W - L - R;
  const n = labels.length, gap = 2, bw = Math.max(4, pw / n - 6);
  const tot = labels.map((_, i) => stacked ? series.reduce((a, s) => a + (+s.values[i] || 0), 0) : Math.max(...series.map(s => +s.values[i] || 0)));
  const max = niceMax(Math.max(...tot, 0));
  const y = v => T + ph - v / max * ph;
  let g = '';
  [0, .5, 1].forEach(f => { const yy = y(max * f); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${Math.round(max * f)}</text>`; });
  let marks = '';
  labels.forEach((lab, i) => {
    const x = L + i * (pw / n) + (pw / n - bw) / 2;
    let base = 0; const tip = [lab];
    if (stacked) {
      series.forEach((s, si) => {
        const v = +s.values[i] || 0; tip.push(`${s.name}: ${v}${unit}`);
        if (!v) return;
        const y1 = y(base + v), y0 = y(base);
        const top = si === series.length - 1 || series.slice(si + 1).every(z => !(+z.values[i]));
        const hh = y0 - y1 - (base > 0 ? gap : 0);
        marks += top ? `<path d="${roundTop(x, y1, bw, hh, 4)}" fill="${s.color}"/>` : `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0, hh)}" fill="${s.color}"/>`;
        base += v;
      });
    } else {
      const sw = (bw - gap * (series.length - 1)) / series.length;
      series.forEach((s, si) => { const v = +s.values[i] || 0; tip.push(`${s.name}: ${v}${unit}`); if (v) marks += `<path d="${roundTop(x + si * (sw + gap), y(v), sw, y(0) - y(v), 3)}" fill="${s.color}"/>`; });
    }
    marks += `<rect class="hit" x="${L + i * (pw / n)}" y="${T}" width="${pw / n}" height="${ph}" data-tip="${esc(tip.join('\n'))}"/>`;
    if (i % every === 0 || i === n - 1) marks += `<text x="${x + bw / 2}" y="${h - 5}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}<line class="base" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${marks}</svg>`;
}
/* lines over dates: series [{name,color,pts:[{d,v}]}], target line, yMin/yMax */
function lineChart({ series, h = 170, yMin = 0, yMax, target, unit = '', x0, x1, area = true }) {
  const W = 340, L = 34, R = 10, T = 10, B = 22, ph = h - T - B, pw = W - L - R;
  const all = series.flatMap(s => s.pts);
  const t = k => new Date(k + 'T12:00:00').getTime();
  let a = x0 ? t(x0) : Math.min(...all.map(p => t(p.d)), now.getTime() - 14 * 864e5);
  let b = x1 ? t(x1) : Math.max(...all.map(p => t(p.d)), now.getTime());
  if (b - a < 864e5) b = a + 864e5;
  const mx = yMax ?? niceMax(Math.max(...all.map(p => p.v), target || 0, yMin + 1));
  const X = k => L + (t(k) - a) / (b - a) * pw;
  const Y = v => T + ph - (v - yMin) / (mx - yMin) * ph;
  let g = '';
  [0, .5, 1].forEach(f => { const v = yMin + (mx - yMin) * f; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${Math.round(v)}</text>`; });
  const dA = new Date(a), dB = new Date(b);
  g += `<text x="${L}" y="${h - 6}">${dA.getDate()} ${MONTHS[dA.getMonth()]}</text><text x="${W - R}" y="${h - 6}" text-anchor="end">${dB.getDate()} ${MONTHS[dB.getMonth()]}${dB.getFullYear() !== now.getFullYear() ? ' ' + dB.getFullYear() : ''}</text>`;
  if (target != null) g += `<line x1="${L}" x2="${W - R}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - R}" y="${Y(target) - 5}" text-anchor="end">goal ${target}</text>`;
  let m = '';
  series.forEach(s => {
    const pts = s.pts.slice().sort((p, q) => p.d.localeCompare(q.d));
    if (!pts.length) return;
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
    if (area && series.length === 1 && pts.length > 1) m += `<path d="${d}L${X(pts[pts.length - 1].d).toFixed(1)},${Y(yMin)}L${X(pts[0].d).toFixed(1)},${Y(yMin)}Z" fill="${s.color}" opacity=".14"/>`;
    m += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => {
      const last = i === pts.length - 1;
      m += `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${last ? 4.5 : 3}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
      m += `<circle class="hit" cx="${X(p.d)}" cy="${Y(p.v)}" r="13" data-tip="${esc(`${dmyy(p.d)}\n${series.length > 1 ? s.name + ': ' : ''}${p.v}${unit}`)}"/>`;
    });
    if (series.length > 1) { const p = pts[pts.length - 1]; m += `<text x="${Math.min(X(p.d) + 6, W - 2)}" y="${Y(p.v) - 6}" text-anchor="${X(p.d) > W - 60 ? 'end' : 'start'}" style="fill:var(--ink)">${esc(s.name)}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}<line class="base" x1="${L}" x2="${W - R}" y1="${Y(yMin)}" y2="${Y(yMin)}"/>${m}</svg>`;
}

const habRx = h => HAB_RX[h] || new RegExp(h.replace(/^[^\p{L}]+/u, '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');

let mapSub = null;
function nmtPlan(days = 14) {
  const plan = (A.nmt && A.nmt.plan) || {}; const q = {}; const idx = { math: 0, hist: 0, ua: 0 };
  ['math', 'hist', 'ua'].forEach(sub => { const all = subjTopics(sub); const cur = nmtCur(sub); const i = Math.max(0, all.indexOf(cur)); q[sub] = all.slice(i).filter(t => t.s === 0); });
  const out = [];
  for (let d = 0; d < days; d++) {
    const k = addDays(TODAY, d), dw = new Date(k + 'T12:00:00').getDay(), sub = NMT_DAY[dw]; if (!sub) continue;
    const ov = plan[k] && findTopic(plan[k]);
    const t = ov ? ov.t : q[sub][idx[sub]++] || null;
    out.push({ k, dw, sub, t, ov: !!ov, mock: MOCKS.includes(k) });
  }
  return out;
}
function vNmtMap() {
  const sub = mapSub || nmtSubject() || 'math';
  const all = subjTopics(sub); const cur = nmtCur(sub);
  const cnt = { ok: 0, theory: 0, fail: 0, none: 0 }; all.forEach(t => cnt[tState(t)]++);
  const lastPass = t => { const x = (t.tests || []).filter(y => y[1] >= 80).slice(-1)[0] || (t.h || []).find(y => y[1]); return x ? x[0] : null; };
  const secs = A.nmt.subjects.find(x => x.id === sub).sections;
  const plan = nmtPlan(14);
  return `<div class="stack view">
    <div class="chips">${['math', 'hist', 'ua'].map(k => `<button class="chip ${k === sub ? 'on' : ''}" data-act="mapSub" data-s="${k}"><i style="background:${col({ ua: 2, math: 1, hist: 3 }[k])}"></i>${NMT_SUBJ[k].name}</button>`).join('')}</div>
    <section class="card hero"><div class="eyebrow">Topic map · ${NMT_SUBJ[sub].name} <span class="num">${cnt.ok}/${all.length} at 80%+</span></div>
      <div class="mapleg"><span><i class="tl ok"></i>done ${cnt.ok}</span><span><i class="tl fail"></i>test &lt;80 ${cnt.fail}</span><span><i class="tl theory"></i>theory without a test ${cnt.theory}</span><span><i class="tl none"></i>ahead ${cnt.none}</span></div>
      ${secs.map(sec => `<div class="sec">${esc(sec.n)}</div><div class="tiles">${sec.topics.map(t => { const st = tState(t), lp = lastPass(t); return `<button class="tl ${st} ${cur && t.id === cur.id ? 'cur' : ''}" data-act="topic" data-t="${t.id}"><b>${esc(t.n)}</b><small>${cur && t.id === cur.id ? '📍 you are here' : st === 'ok' ? '✓ ' + dmy(lp) : st === 'fail' ? lastTest(t)[1] + '% · ' + dmy(lastTest(t)[0]) : st === 'theory' ? 'theory · no test' : ''}</small></button>`; }).join('')}</div>`).join('')}
      <p class="rule">Tap a topic: log a test, mark the theory or “📍 I’m here now”.</p></section>
    <section class="card"><div class="eyebrow">2-week plan — a topic for each day</div>
      ${plan.map(x => `<div class="pl ${x.k === TODAY ? 'today' : ''}"><span class="pd"><b>${['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'][x.dw]}</b>${dmy(x.k)}</span><span class="ps"><i style="background:${col({ ua: 2, math: 1, hist: 3 }[x.sub])}"></i>${NMT_SUBJ[x.sub].name}${x.mock ? ' · 🎯 mock' : ''}</span><span class="pt">${x.t ? esc(x.t.n) : '—'}${x.ov ? ' <small>changed</small>' : ''}</span><button class="mini" data-act="plEdit" data-k="${x.k}" data-s="${x.sub}" aria-label="Change topic">${I.edit}</button></div>`).join('')}
      <p class="rule">The topic for each day comes in order from “📍 you are here”. Want a different one — tap the pencil, and the plan adjusts.</p></section>
  </div>`;
}

}

/* ================= v22: повторення тем НМТ — 1 → 3 → 7 → 21 (9 з 10) → 51 → щомісяця ================= */
/* Дні рахуються від дня вивчення (тест на тему 80%+). ✓ — наступний крок, ✕ — тема з початку.
   Дані графіка живуть у самій темі (t.rp) у rev-nmt, тому синхронізуються разом з рештою. */
const RP_STEPS = [
  { d: 1, l: 'Повтор · 1-й день' },
  { d: 3, l: 'Повтор · 3-й день' },
  { d: 7, l: 'Повтор · 7-й день' },

const RP_MONTH = 'Друге коло · раз на місяць';

const RP_NMT_ERR = ['Maths', 'Ukrainian', 'History'];

const rpIsCheck = t => !!(t.rp && RP_STEPS[t.rp.st] && RP_STEPS[t.rp.st].check);
// дата наступного повтору: кроки — від дня вивчення, друге коло — через 30 днів після останнього повтору
function rpDate(rp) { return rp.st < RP_STEPS.length ? addDays(rp.start, RP_STEPS[rp.st].d) : addDays(TODAY, 30); }
// стадія для старих екранів (Review, піпси): 1 — вивчено, 2 — пройдено 7-й день, 3 — пройдено перевірку (100%), 4 — друге коло
const rpStage = st => (st >= 5 ? 4 : st >= 4 ? 3 : st >= 3 ? 2 : 1);
function rpStart(t) {
  t.s = Math.max(1, t.s || 0); delete t.rx;
  t.rp = { start: TODAY, st: 0, next: addDays(TODAY, 1), log: [] };
  t.next = t.rp.next;
}
function rpAdvance(t, score) {
  const rp = t.rp; rp.log = (rp.log || []).concat([[TODAY, rp.st, 1, score ?? null]]).slice(-30);
  if (rpIsCheck(t)) rp.full = TODAY;
  rp.st++;
  rp.next = maxK(rpDate(rp), addDays(TODAY, 1));
  t.s = Math.max(t.s || 0, rpStage(rp.st)); t.next = rp.next;
}
function rpReset(t, score) {
  const rp = t.rp;
  if (rp) { rp.log = (rp.log || []).concat([[TODAY, rp.st, 0, score ?? null]]); rp.end = TODAY; t.rpOld = (t.rpOld || []).concat([rp]).slice(-6); }
  t.rp = null; t.s = 0; t.next = null; t.rx = TODAY;
  // назад на початок: правило → задачі → помилки → повтори. Галочки уроку знімаються (копія — у hubPrev), сторінки книги лишаються.
  if (t.hub) { const old = {}; ['b', 'v', 'r', 'e'].forEach(k => { if (t.hub[k]) { old[k] = t.hub[k]; delete t.hub[k]; } }); if (Object.keys(old).length) t.hubPrev = old; }

/* ================= timer ================= */
function tick() {
  if (!timer) { clearInterval(tickH); tickH = null; return; }
  const total = timer.mins * 60, el = (Date.now() - timer.start) / 1000, left = total - el;
  const lt = $('#tleft'), rb = $('#rbar'), ring = $('#ring'), lab = $('#tlabel'), th = $('#thint');
  if (lt) {
    const a = Math.abs(Math.round(left));
    lt.textContent = (left < 0 ? '+' : '') + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
    rb.style.strokeDashoffset = String(326.7 * Math.min(1, Math.max(0, el / total)));
    ring.classList.toggle('over', left < 0);
    lab.textContent = timer.kind === 'break' ? 'break 15 min' : '45 min of work';
    if (left < 0) th.textContent = timer.kind === 'break' ? 'Break over. Next container.' : 'Block over → close it. What’s left becomes a card on the board.';
  }
  if (!tickH) tickH = setInterval(tick, 1000);
}

/* ================= fx: particle burst ================= */
function burst(el) {
  if (RM) return;
  const cv = $('#fx'), ctx = cv.getContext('2d'); const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2 - 20, top: innerHeight - 200, width: 40, height: 40 };
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cs = getComputedStyle(document.documentElement);
  const colors = [1, 2, 3, 4, 5, 7].map(i => cs.getPropertyValue('--c' + i).trim());
  const P = Array.from({ length: 46 }, () => { const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5; return { x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, c: colors[Math.floor(Math.random() * colors.length)], w: 4 + Math.random() * 4 }; });
  let raf; const step = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = false;
    P.forEach(p => { if (p.life <= 0) return; alive = true; p.x += p.vx; p.y += p.vy; p.vy += .18; p.life -= .018; ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.w, p.w * .6); });
    if (alive) raf = requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  cancelAnimationFrame(raf); step();
}

const confirmArm = {};
function armed(key, el, label) {
  if (confirmArm[key] && Date.now() - confirmArm[key] < 4000) { delete confirmArm[key]; return true; }
  confirmArm[key] = Date.now(); el.textContent = label; return false;
}

/* ================= ↶ Undo — any tap that changed your data can be taken back ================= */
const UNDO = [];
const undoSnap = () => { try { return { D: JSON.stringify(D), BD: JSON.stringify(BD), G: JSON.stringify(G), A: JSON.stringify(A), W: W ? JSON.stringify(W) : null }; } catch { return null; } };
function undoPaint() { const b = $('#undoBtn'); if (b) b.hidden = !UNDO.length; }
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || ['undo', 'go', 'back', 'scrim', 'settings'].includes(el.dataset.act)) return;
  const before = undoSnap(); if (!before) return;
  setTimeout(() => {
    const after = undoSnap(); if (!after) return; const diff = {};
    Object.keys(before).forEach(k => { if (before[k] !== after[k]) diff[k] = before[k]; });
    if (!Object.keys(diff).length) return;
    UNDO.push(diff); if (UNDO.length > 30) UNDO.shift(); undoPaint();
  }, 0);
}, true);
function undoLast() {
  const u = UNDO.pop(); undoPaint(); if (!u) return;
  if (u.D) { D = JSON.parse(u.D); HIST[TODAY] = D; saveDay(); }
  if (u.BD) { BD = JSON.parse(u.BD); saveBoard(); }
  if (u.G) { G = JSON.parse(u.G); saveGoals(); }
  if (u.A) { A = JSON.parse(u.A); Object.values(A).forEach(a => a && a.id && saveArea(a)); }
  if (u.W && W) { const w = JSON.parse(u.W); Object.assign(W, w); Store.save('week-' + W.sun, W, true); }
  closeSheet(); render(); toast('↶ Undone');
}
document.addEventListener('click', e => {
  const tb = e.target.closest('.tabs [data-tab]');
  if (tb) { go(tb.dataset.tab); return; }
  let el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, i = +el.dataset.i;
  switch (act) {
    case 'scrim': if (e.target === el) closeSheet(); break;
    case 'undo': undoLast(); break;

  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  try {
    const j = JSON.parse(await e.target.files[0].text());
    if (j.app !== 'pult' || !j.data) throw new Error('bad');
    Object.entries(j.data).forEach(([k, v]) => { localStorage.setItem(k, v); syncTouch(k.replace(/^pult:/, '')); });
    toast('Data restored.'); closeSheet(); await load(); render();
  } catch { toast('This isn’t a Zhyva Voda backup file.'); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter) { e.preventDefault(); const b = e.target.parentElement.querySelector(`button[data-act="${e.target.dataset.enter}"]`); if (b) b.click(); return; }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('#newToday,#newTomorrow,#newCard,#newObs,#msNew,#topicNew')) { e.preventDefault(); const b = e.target.parentElement.querySelector('button'); if (b) b.click(); }
});
