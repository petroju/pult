<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16213A">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Пульт</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: one-screen phone app — header, a single scrolling view, a fixed 5-tab bar. Indigo ink on cool paper; red hanko seal only for kaizen; 8 validated series hues for life spheres. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --sunk:#E3E8F0; --line:#D3DAE6;
  --ink:#16213A; --muted:#5C6884; --accent:#2D47A6; --accent-soft:#DCE3F8;
  --seal:#C93A26; --good:#22865B; --warn:#B9761C; --bad:#C93A26;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --s1:#86b6ef; --s2:#3987e5; --s3:#256abf; --s4:#104281;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --shadow:0 1px 2px rgba(22,33,58,.06),0 6px 20px rgba(22,33,58,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1322; --surface:#151D31; --sunk:#1C2640; --line:#28334F;
  --ink:#E7EBF5; --muted:#97A3BF; --accent:#90A7FF; --accent-soft:#233160;
  --seal:#F0634B; --good:#4CC28C; --warn:#E6A84A; --bad:#F0634B;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767;
  --s1:#1c5cab; --s2:#3987e5; --s3:#6da7ec; --s4:#b7d3f6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1322; --surface:#151D31; --sunk:#1C2640; --line:#28334F;
  --ink:#E7EBF5; --muted:#97A3BF; --accent:#90A7FF; --accent-soft:#233160;
  --seal:#F0634B; --good:#4CC28C; --warn:#E6A84A; --bad:#F0634B;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#2f9a2f; --c7:#9085e9; --c8:#e66767;
  --s1:#1c5cab; --s2:#3987e5; --s3:#6da7ec; --s4:#b7d3f6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 128px}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:6px 14px}
.top-l{display:flex;gap:10px;align-items:flex-start;min-width:0}
.brand{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.dot.cloud{background:var(--good)}
.date{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.15;margin-top:4px;text-wrap:balance;overflow-wrap:anywhere}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.mission{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin-bottom:16px}
.mission b{color:var(--ink);font-weight:600}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.stack>.card:nth-child(2){animation-delay:.04s}.stack>.card:nth-child(3){animation-delay:.08s}.stack>.card:nth-child(4){animation-delay:.12s}.stack>.card:nth-child(5){animation-delay:.16s}.stack>.card:nth-child(6){animation-delay:.2s}.stack>.card:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:.35;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.eyebrow .num{font-family:var(--mono);letter-spacing:0;color:var(--accent);text-transform:none}
.hero{border-color:transparent;background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.rule{font-size:12.5px;color:var(--muted);margin:10px 0 0}
.h2{font-family:var(--display);font-weight:500;font-size:19px;line-height:1.25;margin:0;text-wrap:balance}

.task{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.task:last-of-type{border-bottom:0}
.task input{flex:1;min-width:0;border:0;background:transparent;padding:8px 2px;font-weight:600;font-size:16px;outline:none}
.task input::placeholder{color:var(--muted);font-weight:500}
.task.done input{text-decoration:line-through;color:var(--muted)}
.check{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;transition:all .2s;padding:0}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.done .check,.check.on{background:var(--good);border-color:var(--good);color:#fff}
.done .check svg,.check.on svg{opacity:1;transform:none}
.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none;padding:0}
.mini svg{width:17px;height:17px}
.idx{font-family:var(--mono);font-size:12px;color:var(--muted);width:14px;flex:none}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font-family:var(--mono);font-size:15px;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.2em}
.hint.low{color:var(--warn);font-weight:600}

.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.habit{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);cursor:pointer;text-align:left;font-size:13.5px;font-weight:600;min-width:0;transition:all .2s}
.habit span.l{min-width:0;overflow-wrap:anywhere}
.habit.on{background:var(--accent-soft);border-color:var(--accent)}
.habit .tick{width:18px;height:18px;border-radius:6px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.habit.on .tick{background:var(--accent);border-color:var(--accent)}
.habit.on .tick::after{content:"";width:8px;height:4px;border-left:2px solid var(--surface);border-bottom:2px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.05)}}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.app-l{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:14px;text-decoration:none;font-size:12.5px;font-weight:600;text-align:center;background:var(--surface);transition:transform .15s;min-width:0;overflow-wrap:anywhere}
.app-l:active{transform:scale(.96)}
.app-l i{font-style:normal;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-size:14px}

.timer{display:flex;gap:16px;align-items:center}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--sunk)}
.ring .rb{stroke:var(--accent);transition:stroke-dashoffset 1s linear}
.ring.over .rb{stroke:var(--warn)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:22px}
.tbody{min-width:0;flex:1}
.tname{font-weight:700;font-size:16px;overflow-wrap:anywhere}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .12s,background .2s;text-align:center}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ok{background:var(--good);border-color:var(--good);color:#fff}
.btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{background:transparent}
.btn.block{width:100%;padding:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row>.btn{flex:1}

.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field:first-child{margin-top:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
textarea,.in{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:11px 12px;outline:none;resize:vertical;min-width:0}
textarea:focus,.in:focus{box-shadow:0 0 0 3px var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two .field{margin-top:12px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nums .in,.in.num{font-family:var(--mono);text-align:center;font-size:17px}
.numline{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:nowrap}

.kz-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:26px;height:8px;border-radius:4px;border:0;background:var(--sunk);cursor:pointer;padding:0}
.dots button.fill{background:var(--accent-soft)}
.dots button.cur{background:var(--accent)}
.kq{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.25;text-wrap:balance;margin:6px 0 14px}
.kstep{animation:slide .35s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{opacity:.3;transform:translateX(18px)}to{opacity:1;transform:none}}
.kstep.back{animation-name:slideb}
@keyframes slideb{from{opacity:.3;transform:translateX(-18px)}to{opacity:1;transform:none}}
.algo{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center}
.algo span{font-family:var(--display);font-size:13px;color:var(--accent)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seal{width:84px;height:84px;border-radius:14px;border:3px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-size:30px;font-weight:700;transform:rotate(-8deg);margin:6px auto 4px;letter-spacing:.05em}
.seal.stamp{animation:stamp .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes stamp{0%{transform:rotate(-8deg) scale(2.2);opacity:0}60%{transform:rotate(-8deg) scale(.92);opacity:1}100%{transform:rotate(-8deg) scale(1)}}
.done-msg{text-align:center;font-weight:700;margin-bottom:6px}

.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.yn button.on.y{background:var(--good);border-color:var(--good);color:#fff}
.yn button.on.n{background:var(--bad);border-color:var(--bad);color:#fff}

/* dreams */
.vision{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.vision::-webkit-scrollbar{display:none}
.vcard{flex:0 0 82%;scroll-snap-align:center;border-radius:18px;padding:18px;background:var(--ink);color:var(--bg);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.vcard::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;border:18px solid color-mix(in srgb,var(--bg) 10%,transparent)}
.vcard p{font-family:var(--display);font-weight:500;font-size:16.5px;line-height:1.35;margin:0;position:relative;z-index:1;text-wrap:pretty}
.vcard small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;font-weight:700}
.closeness{display:flex;align-items:center;gap:16px}
.spheres{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sph{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:var(--shadow);animation:rise .45s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s}
.sph:active{transform:scale(.97)}
.sph .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;min-width:0}
.sph .nm i{width:10px;height:10px;border-radius:50%;flex:none}
.sph .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sph .dr{font-size:12.5px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.sph .bot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pct{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.pct small{font-size:12px;font-weight:500;color:var(--muted)}
.mring{flex:none}
.mring circle{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.strip{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding-inline:16px;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .sph{flex:0 0 132px;padding:12px;gap:6px;align-items:center;text-align:center;box-shadow:none}
.strip .sph .nm{justify-content:center;font-size:12.5px}
.gdream{font-family:var(--display);font-weight:500;font-size:20px;line-height:1.3;text-wrap:balance;margin:4px 0 0}
.bigring{position:relative;width:170px;height:170px;margin:4px auto 6px}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bigring .lbl b{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.bigring .lbl span{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:22px;color:var(--good);pointer-events:none;animation:floatup 1.4s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-60px)}}
.ms{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ms:last-child{border-bottom:0}
.ms span{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;font-size:14px}
.ms.done span{color:var(--muted);text-decoration:line-through}
.pace{font-size:14px;background:var(--sunk);border-radius:12px;padding:10px 12px;margin-top:10px}
.pace b{font-family:var(--mono)}

/* reviews */
.due{display:flex;flex-direction:column}
.drow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow .t{flex:1;min-width:0}
.drow .t b{display:block;font-size:14px;font-weight:700;overflow-wrap:anywhere}
.drow .t small{font-size:12px;color:var(--muted)}
.qb{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;display:grid;place-items:center;flex:none;padding:0}
.qb.ok{color:var(--good)}.qb.no{color:var(--bad)}
.qb svg{width:18px;height:18px}
.area{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.area-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.area-h b{font-size:16px}
.badge{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px;background:var(--sunk);white-space:nowrap}
.badge.due{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:var(--ink)}
.stagebar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.stagebar div{height:100%;min-width:0;transition:flex-grow .8s}
.st0{background:var(--sunk)}.st1{background:var(--s1)}.st2{background:var(--s2)}.st3{background:var(--s3)}.st4{background:var(--s4)}
.slegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}
.slegend span{display:inline-flex;align-items:center;gap:5px}
.slegend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.subj-row{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.subj-row b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj-row .badge{font-size:11px}
.sec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.sec:first-child{margin-top:0}
.topic{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.topic .tn{flex:1;min-width:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.pips{display:flex;gap:3px;flex:none}
.pips i{width:9px;height:9px;border-radius:3px;background:var(--sunk)}
.pips i.f1{background:var(--s1)}.pips i.f2{background:var(--s2)}.pips i.f3{background:var(--s3)}.pips i.f4{background:var(--s4)}
.topic .badge{font-size:10.5px}
.flash-ok{animation:fok .8s}
@keyframes fok{30%{background:color-mix(in srgb,var(--good) 25%,transparent)}}

/* charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:10px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.legend2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend2 span{display:inline-flex;align-items:center;gap:6px}
.legend2 i{width:12px;height:3px;border-radius:2px;display:inline-block}
.legend2 i.sq{height:10px;width:10px;border-radius:3px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 40px;gap:10px;align-items:center;font-size:13px;margin-top:8px}
.hbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .tr{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}

const Store = {
  mode: 'local', db: null, uid: null, timers: {}, chains: {},
  async init() {
    try {
      for (let i = 0; i < 0 && !(window.claude && window.claude.use); i++) await new Promise(r => setTimeout(r, 100));
      if (!(window.claude && window.claude.use)) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.db = db; this.uid = id; this.mode = 'cloud';
    } catch { this.mode = 'local'; }
  },
  col() { return this.db.collection('data/users/' + this.uid); },
  async get(id) {
    if (this.mode === 'cloud') {
      try { const s = await this.col().doc(id).get(); if (s.exists) { const v = clone(s.data()); lsSet(id, v); return v; } return null; }
      catch { return lsGet(id); }
    }
    return lsGet(id);
  },
  async list(kind, prefix) {
    if (this.mode === 'cloud') {
      try { const q = await this.col().where('kind', '==', kind).limit(500).get(); return q.docs.map(d => clone(d.data())); } catch {}
    }
    return lsKeys(prefix).map(k => lsGet(k)).filter(Boolean);
  },
  save(id, obj, now = false) {
    lsSet(id, obj);
    clearTimeout(this.timers[id]);
    const run = () => {
      if (this.mode !== 'cloud') return;
      const body = clone(obj);
      this.chains[id] = (this.chains[id] || Promise.resolve())
        .then(() => this.col().doc(id).set(body))
        .then(() => setSync('cloud'))
        .catch(e => { setSync('err'); if (e && e.code === 'quota_exceeded') toast('Сховище заповнене — зміни лише на цьому пристрої.'); });
    };
    if (now) run(); else this.timers[id] = setTimeout(run, 700);
  },
  async remove(id) {
    try { localStorage.removeItem('pult:' + id); } catch {}
    if (this.mode === 'cloud') { try { await this.col().doc(id).delete(); } catch {} }
  }
};

function areaTopics(a) { const out = []; (a?.subjects || []).forEach(s => s.sections.forEach(sec => sec.topics.forEach(t => out.push(t)))); return out; }
function habitCount(h, since) { let n = 0; for (const k in HIST) { if ((!since || k >= since) && HIST[k]?.habits?.[h]) n++; } return n; }
function sphereVals(sp) {
  let cur, target = +sp.target || 0, start = +sp.start || 0, auto = sp.auto || '';
  if (auto.startsWith('topics:')) {
    const a = A[auto.slice(7)]; const all = areaTopics(a);
    cur = all.filter(t => t.s >= 1).length; target = all.length || 1; start = 0;
  } else if (auto.startsWith('habit:')) {
    cur = start + habitCount(auto.slice(6));
  } else {
    cur = sp.log.length ? +sp.log[sp.log.length - 1].v : start;
  }
  const pct = target === start ? 0 : clamp((cur - start) / (target - start), 0, 1);
  return { cur, target, start, pct };
}
function sphereSeries(sp) {
  const auto = sp.auto || '';
  if (auto.startsWith('habit:')) {
    const h = auto.slice(6); const keys = Object.keys(HIST).filter(k => HIST[k]?.habits?.[h]).sort();
    let n = +sp.start || 0; return keys.map(k => ({ d: k, v: ++n }));
  }
  if (auto.startsWith('topics:')) {
    const ev = [];
    areaTopics(A[auto.slice(7)]).forEach(t => { const f = (t.h || []).find(x => x[1] === 1); if (t.s >= 1) ev.push(f ? f[0] : TODAY); });
    ev.sort(); let n = 0; const out = []; ev.forEach(d => { n++; if (out.length && out[out.length - 1].d === d) out[out.length - 1].v = n; else out.push({ d, v: n }); });
    return out;
  }
  return (sp.log || []).map(x => ({ d: x.d, v: +x.v }));
}
function pace(sp) {
  const v = sphereVals(sp), ser = sphereSeries(sp);
  const left = v.target - v.cur;
  if (left <= 0) return 'Ціль досягнута. Час поставити нову, сміливішу.';
  const days = Math.max(1, Math.round((new Date(sp.deadline + 'T12:00:00') - now) / 864e5));
  const perWeek = left / days * 7;
  const fmt = n => n >= 10 ? Math.round(n) : n.toFixed(1).replace('.0', '');
  let s = `До ${dmyy(sp.deadline)} лишилось <b>${days}</b> дн. Треба <b>+${fmt(perWeek)}</b> ${esc(sp.unit)} на тиждень.`;
  if (ser.length >= 2) {
    const a = ser[0], b = ser[ser.length - 1];
    const span = Math.max(1, (new Date(b.d) - new Date(a.d)) / 864e5);
    const rate = (b.v - a.v) / span * 7;
    if (rate > 0) {
      const eta = new Date(now.getTime() + left / rate * 7 * 864e5);
      s += ` Твій темп: <b>+${fmt(rate)}</b> на тиждень → дійдеш приблизно в <b>${MONTHS[eta.getMonth()]} ${eta.getFullYear()}</b>${eta <= new Date(sp.deadline) ? ' — вчасно ▲' : ' — пізніше за дедлайн, додай темпу'}.`;
    }
  }
  return s;
}

function sphereSnapshot() { const m = {}; G.spheres.forEach(s => m[s.id] = sphereVals(s).cur); return m; }
function announceRise(before) {
  const ups = G.spheres.map(s => ({ s, d: sphereVals(s).cur - (before[s.id] ?? 0) })).filter(x => x.d > 0);
  if (ups.length) { const u = ups[0]; toast(`▲ ${u.s.name}: ${sphereVals(u.s).cur} ${u.s.unit} · ${Math.round(sphereVals(u.s).pct * 100)}% до мрії`, true); burst(); }
}

/* ================= charts ================= */
function ringSvg(id, pct, color, size = 64, stroke = 7) {
  const r = (size - stroke) / 2, C = 2 * Math.PI * r;
  const from = lastPct[id] ?? 0; lastPct[id] = pct;
  return `<svg class="mring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="${stroke}"/><circle data-ring="${(C * (1 - pct)).toFixed(2)}" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" ${pct <= 0 ? 'stroke-opacity="0"' : ''} stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - from)).toFixed(2)}"/></svg>`;
}
function animateRings() {
  requestAnimationFrame(() => requestAnimationFrame(() => $$('[data-ring]').forEach(c => c.setAttribute('stroke-dashoffset', c.dataset.ring))));
}
function niceMax(v) { v = Math.max(v, 4); const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
const roundTop = (x, y, w, h, r) => { r = Math.min(r, w / 2, h); if (h <= 0) return ''; return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };

/* bars: labels[], series [{name,color,values}], stacked */
function barChart({ labels, series, h = 150, unit = '', stacked = true, every = 1 }) {
  const W = 340, L = 30, R = 6, T = 8, B = 20, ph = h - T - B, pw = W - L - R;
  const n = labels.length, gap = 2, bw = Math.max(4, pw / n - 6);
  const tot = labels.map((_, i) => stacked ? series.reduce((a, s) => a + (+s.values[i] || 0), 0) : Math.max(...series.map(s => +s.values[i] || 0)));
  const max = niceMax(Math.max(...tot, 0));
  const y = v => T + ph - v / max * ph;
  let g = '';
  [0, .5, 1].forEach(f => { const yy = y(max * f); g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 3}" text-anchor="end">${Math.round(max * f)}</text>`; });
  let marks = '';
  labels.forEach((lab, i) => {
    const x = L + i * (pw / n) + (pw / n - bw) / 2;
    let base = 0; const tip = [lab];
    if (stacked) {
      series.forEach((s, si) => {
        const v = +s.values[i] || 0; tip.push(`${s.name}: ${v}${unit}`);
        if (!v) return;
        const y1 = y(base + v), y0 = y(base);
        const top = si === series.length - 1 || series.slice(si + 1).every(z => !(+z.values[i]));
        const hh = y0 - y1 - (base > 0 ? gap : 0);
        marks += top ? `<path d="${roundTop(x, y1, bw, hh, 4)}" fill="${s.color}"/>` : `<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(0, hh)}" fill="${s.color}"/>`;
        base += v;
      });
    } else {
      const sw = (bw - gap * (series.length - 1)) / series.length;
      series.forEach((s, si) => { const v = +s.values[i] || 0; tip.push(`${s.name}: ${v}${unit}`); if (v) marks += `<path d="${roundTop(x + si * (sw + gap), y(v), sw, y(0) - y(v), 3)}" fill="${s.color}"/>`; });
    }
    marks += `<rect class="hit" x="${L + i * (pw / n)}" y="${T}" width="${pw / n}" height="${ph}" data-tip="${esc(tip.join('\n'))}"/>`;
    if (i % every === 0 || i === n - 1) marks += `<text x="${x + bw / 2}" y="${h - 5}" text-anchor="middle">${esc(lab)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}<line class="base" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>${marks}</svg>`;
}
/* lines over dates: series [{name,color,pts:[{d,v}]}], target line, yMin/yMax */
function lineChart({ series, h = 170, yMin = 0, yMax, target, unit = '', x0, x1, area = true }) {
  const W = 340, L = 34, R = 10, T = 10, B = 22, ph = h - T - B, pw = W - L - R;
  const all = series.flatMap(s => s.pts);
  const t = k => new Date(k + 'T12:00:00').getTime();
  let a = x0 ? t(x0) : Math.min(...all.map(p => t(p.d)), now.getTime() - 14 * 864e5);
  let b = x1 ? t(x1) : Math.max(...all.map(p => t(p.d)), now.getTime());
  if (b - a < 864e5) b = a + 864e5;
  const mx = yMax ?? niceMax(Math.max(...all.map(p => p.v), target || 0, yMin + 1));
  const X = k => L + (t(k) - a) / (b - a) * pw;
  const Y = v => T + ph - (v - yMin) / (mx - yMin) * ph;
  let g = '';
  [0, .5, 1].forEach(f => { const v = yMin + (mx - yMin) * f; g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${Math.round(v)}</text>`; });
  const dA = new Date(a), dB = new Date(b);
  g += `<text x="${L}" y="${h - 6}">${dA.getDate()} ${MONTHS[dA.getMonth()]}</text><text x="${W - R}" y="${h - 6}" text-anchor="end">${dB.getDate()} ${MONTHS[dB.getMonth()]}${dB.getFullYear() !== now.getFullYear() ? ' ' + dB.getFullYear() : ''}</text>`;
  if (target != null) g += `<line x1="${L}" x2="${W - R}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W - R}" y="${Y(target) - 5}" text-anchor="end">мета ${target}</text>`;
  let m = '';
  series.forEach(s => {
    const pts = s.pts.slice().sort((p, q) => p.d.localeCompare(q.d));
    if (!pts.length) return;
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.d).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
    if (area && series.length === 1 && pts.length > 1) m += `<path d="${d}L${X(pts[pts.length - 1].d).toFixed(1)},${Y(yMin)}L${X(pts[0].d).toFixed(1)},${Y(yMin)}Z" fill="${s.color}" opacity=".14"/>`;
    m += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => {
      const last = i === pts.length - 1;
      m += `<circle cx="${X(p.d)}" cy="${Y(p.v)}" r="${last ? 4.5 : 3}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
      m += `<circle class="hit" cx="${X(p.d)}" cy="${Y(p.v)}" r="13" data-tip="${esc(`${dmyy(p.d)}\n${series.length > 1 ? s.name + ': ' : ''}${p.v}${unit}`)}"/>`;
    });
    if (series.length > 1) { const p = pts[pts.length - 1]; m += `<text x="${Math.min(X(p.d) + 6, W - 2)}" y="${Y(p.v) - 6}" text-anchor="${X(p.d) > W - 60 ? 'end' : 'start'}" style="fill:var(--ink)">${esc(s.name)}</text>`; }
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}<line class="base" x1="${L}" x2="${W - R}" y1="${Y(yMin)}" y2="${Y(yMin)}"/>${m}</svg>`;
}
const legend = items => `<div class="legend2">${items.map(([n, c, sq]) => `<span><i class="${sq ? 'sq' : ''}" style="background:${c}"></i>${esc(n)}</span>`).join('')}</div>`;
const col = n => `var(--c${n})`;

      <input id="t3-${i}" data-bind="top3.${i}.t" value="${esc(x.t)}" placeholder="${['Найважливіша задача', 'Друга', 'Третя'][i]}" autocomplete="off">
      <button class="mini" data-act="timer" data-i="${i}" aria-label="Почати контейнер 45 хв">${I.clock}</button>
      <a class="mini" id="cal-${i}" href="${calHref(x.t)}" target="_blank" rel="noopener" aria-label="Поставити в календар">${I.cal}</a>
    </div>`).join('');
  const closed = D.top3.filter(x => x.done && x.t).length;
  const hab = S.habits.map(h => `<button class="habit ${D.habits[h] ? 'on' : ''}" data-act="habit" data-h="${esc(h)}"><span class="tick"></span><span class="l">${esc(h)}</span></button>`).join('');
  const hd = S.habits.filter(h => D.habits[h]).length;
  const due = dueList();
  const strip = G.spheres.map(sp => { const v = sphereVals(sp); return `<button class="sph" data-act="goal" data-id="${sp.id}">${ringSvg('d-' + sp.id, v.pct, col(sp.c), 54, 6)}<div class="nm"><span>${esc(sp.name)}</span></div><div class="muted" style="font-family:var(--mono);font-size:12px">${Math.round(v.pct * 100)}%</div></button>`; }).join('');
  const evening = now.getHours() >= 18;
  const eveBtn = `<button class="eve" data-act="go" data-r="evening">${I.moon}<div><b>${D.evening.closed ? 'День закрито' : 'Вечір — 5 хвилин'}</b><small>${D.evening.closed ? 'Можна переглянути або доповнити' : 'Число дня, подяка, урок і топ-3 на завтра'}</small></div></button>`;

  return `<div class="stack view">
    ${evening ? eveBtn : ''}
    <section class="card hero">
      <div class="eyebrow">Топ-3 на сьогодні <span class="num">${closed}/3</span></div>
      ${t3}
      <p class="rule">Одна задача за раз, до кінця. Годинник запускає контейнер 45 хв, календар ставить блок у Google Calendar.</p>
    </section>
    ${timer ? vTimer() : ''}
    <section class="card">
      <div class="eyebrow">Ближче до мрії <button class="chip" style="padding:3px 10px;font-size:11px" data-act="go" data-r="dreams">усі мрії</button></div>
      <div class="strip">${strip}</div>
    </section>
    <section class="card">
      <div class="eyebrow">Повторити сьогодні <span class="num">${due.length}</span></div>
      ${due.length ? `<div class="due">${due.slice(0, 3).map(dueRow).join('')}</div>${due.length > 3 ? `<div class="row"><button class="btn" data-act="go" data-r="reviews">Ще ${due.length - 3} у Рев'ю</button></div>` : ''}` : `<p class="empty">На сьогодні повторень немає. Нова тема на 80% стане першою перевіркою через тиждень.</p>`}
    </section>
    <section class="card">
      <div class="eyebrow">Енергія <span class="num">${D.energy ?? '—'}</span></div>
      <div class="seg">${[100, 75, 50, 25].map(v => `<button data-act="energy" data-v="${v}" class="${D.energy === v ? 'on' : ''}">${v}</button>`).join('')}</div>
      <div class="hint ${D.energy && D.energy <= 50 ? 'low' : ''}">${D.energy ? ENERGY[D.energy] : 'Як ти сьогодні? Обери чесно — від цього залежить план.'}</div>
    </section>
    <section class="card">

      <div class="apps">${appsList().map(a => `<a class="app-l" href="${esc(a.url)}" target="_blank" rel="noopener"><i>${esc(a.name.slice(0, 1))}</i>${esc(a.name)}</a>`).join('')}</div>
    </section>

function vGoal(id) {
  const sp = G.spheres.find(s => s.id === id);
  if (!sp) return vDreams();
  const v = sphereVals(sp), ser = sphereSeries(sp);
  const C = 2 * Math.PI * 72, from = lastPct['big-' + id] ?? 0; lastPct['big-' + id] = v.pct;
  const isAuto = !!sp.auto;
  const pts = ser;
  const chart = pts.length ? lineChart({ series: [{ name: sp.name, color: col(sp.c), pts }], target: v.target, yMin: Math.min(+sp.start || 0, ...pts.map(p => p.v)), yMax: Math.max(v.target, ...pts.map(p => p.v)) + (Math.max(v.target, ...pts.map(p => p.v)) - Math.min(+sp.start || 0, ...pts.map(p => p.v))) * 0.08, unit: ' ' + sp.unit, x0: pts[0].d < addDays(TODAY, -14) ? undefined : addDays(TODAY, -14) })
    : `<p class="empty">Тут зʼявиться графік, щойно буде перший запис.</p>`;
  const autoNote = sp.auto.startsWith('habit:') ? `Рахується автоматично: кожен день із галочкою «${esc(sp.auto.slice(6))}» у трекері.` : sp.auto.startsWith('topics:') ? `Рахується автоматично: кожна тема з Рев'ю на 80%+ додає 1.` : '';
  const ms = sp.ms.map((m, i) => `<div class="ms ${m.done ? 'done' : ''}"><button class="check ${m.done ? 'on' : ''}" data-act="ms" data-id="${id}" data-i="${i}" aria-label="Етап виконано">${I.check}</button><span>${esc(m.t)}</span></div>`).join('');
  return `<div class="stack view">
    <section class="card hero" style="position:relative">
      <div class="eyebrow"><span style="display:inline-flex;gap:7px;align-items:center"><i style="width:10px;height:10px;border-radius:50%;background:${col(sp.c)};display:inline-block"></i>Мрія</span><button class="mini" data-act="editGoal" data-id="${id}" aria-label="Редагувати">${I.edit}</button></div>
      <p class="gdream">${esc(sp.dream)}</p>
      <div class="bigring" id="bigring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="72" fill="none" stroke="var(--sunk)" stroke-width="14"/><circle data-ring="${(C * (1 - v.pct)).toFixed(2)}" cx="85" cy="85" r="72" fill="none" stroke="${col(sp.c)}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - from)).toFixed(2)}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)"/></svg>
        <div class="lbl"><b id="bigpct">${Math.round(v.pct * 100)}%</b><span>${v.cur} / ${v.target}</span><span>${esc(sp.label || sp.unit)}</span></div></div>
      ${isAuto ? `<p class="rule" style="text-align:center">${autoNote}</p>` : `<div class="row"><button class="btn primary" data-act="logGoal" data-id="${id}">${I.plus} Записати прогрес</button><button class="btn" data-act="plusOne" data-id="${id}">+1</button></div>`}
      ${sp.why ? `<p class="rule"><b style="color:var(--ink)">Навіщо:</b> ${esc(sp.why)}</p>` : ''}
    </section>
    <section class="card">
      <div class="eyebrow">Шлях до мети</div>
      ${chart}
      <div class="pace">${pace(sp)}</div>
    </section>
    <section class="card">
      <div class="eyebrow">Етапи <span class="num">${sp.ms.filter(m => m.done).length}/${sp.ms.length}</span></div>
      ${ms || '<p class="empty">Розбий мрію на 3–5 етапів.</p>'}
      <div class="row"><input class="in" id="msNew" placeholder="Новий етап…" style="flex:1"><button class="btn" data-act="addMs" data-id="${id}">Додати</button></div>
    </section>
    ${sp.id === 'nmt' && A.nmt ? `<button class="btn block" data-act="go" data-r="area:nmt">Відкрити теми НМТ у Рев'ю</button>` : ''}
    ${sp.note ? `<a class="btn block" href="${esc(obsOpen(sp.note))}" target="_blank" rel="noopener">${I.out} Нотатка в Obsidian</a>` : ''}
  </div>`;
}

function stageBar(c) { const tot = c.reduce((a, b) => a + b, 0) || 1; return `<div class="stagebar" data-tip="${esc(c.map((n, i) => (STAGE_SHORT[i]) + ': ' + n).join('\n'))}">${c.map((n, i) => n ? `<div class="st${i}" style="flex-grow:${n / tot}"></div>` : '').join('')}</div>`; }

function stageLegend(labels) { if (!labels) return ''; return `<div class="slegend">${labels.map((l, i) => `<span><i class="st${i}"></i>${esc(l)}</span>`).join('')}</div>`; }

/* ================= views: progress ================= */
function weekStats(endKey, back) {
  const out = { closed: 0, points: 0, en: 0, nmt: 0, kaizen: 0, reviews: 0, any: false };
  for (let i = 0; i < 7; i++) {
    const x = HIST[addDays(endKey, -back - i)];
    if (!x) continue;
    out.any = true;
    out.closed += (x.top3 || []).filter(t => t.done && t.t).length;
    out.points += +(x.evening?.points) || 0;
    out.en += +(x.evening?.en) || 0;
    out.nmt += +(x.evening?.nmt) || 0;
    out.kaizen += x.kaizen?.done ? 1 : 0;
    out.reviews += +x.reviews || 0;
  }
  return out;
}
function dayLevel(x) { if (!x) return 0; const c = (x.top3 || []).filter(t => t.done && t.t).length; return Math.min(3, (x.kaizen?.done ? 1 : 0) + (c >= 3 ? 2 : c >= 1 ? 1 : 0)); }
function vProgress() {
  HIST[TODAY] = D;
  const a = weekStats(TODAY, 0), b = weekStats(TODAY, 7);
  const M = [['Закрито задач', a.closed, b.closed, v => v], ['Бали', a.points, b.points, v => v], ['English', a.en, b.en, v => (v / 60).toFixed(1) + ' год'], ['НМТ', a.nmt, b.nmt, v => (v / 60).toFixed(1) + ' год'], ['Повторень тем', a.reviews, b.reviews, v => v], ['Дні з кайдзеном', a.kaizen, b.kaizen, v => v + '/7']];
  let up = 0, down = 0;
  const rows = M.map(([n, x, y, f]) => { const d = x > y ? 'up' : x < y ? 'down' : 'same'; if (d === 'up') up++; if (d === 'down') down++; return `<div class="mrow"><span>${n}</span><span class="v">${f(x)}</span><span class="p">${f(y)}</span><span class="ar ${d}" aria-label="${d === 'up' ? 'більше' : d === 'down' ? 'менше' : 'так само'}">${d === 'up' ? '▲' : d === 'down' ? '▼' : '='}</span></div>`; }).join('');
  let vClass = 'same', vText = 'ТАК САМО';
  if (!b.any) vText = 'БАЗА';
  else if (up > down) { vClass = 'up'; vText = '▲ БЛИЖЧЕ'; }
  else if (down > up) { vClass = 'down'; vText = '▼ ПОЗАДУ'; }
  // last 14 days
  const days14 = Array.from({ length: 14 }, (_, i) => addDays(TODAY, i - 13));
  const lab14 = days14.map(k => +k.slice(8));
  const minutes = barChart({ labels: lab14, series: [{ name: 'English', color: col(1), values: days14.map(k => +(HIST[k]?.evening?.en) || 0) }, { name: 'НМТ', color: col(2), values: days14.map(k => +(HIST[k]?.evening?.nmt) || 0) }], unit: ' хв', every: 2 });
  const revs = barChart({ labels: lab14, series: [{ name: 'Повторень', color: col(3), values: days14.map(k => +HIST[k]?.reviews || 0) }], every: 2, h: 120 });
  // weekly closed, 8 weeks
  const w8 = Array.from({ length: 8 }, (_, i) => 7 - i);
  const closedW = barChart({ labels: w8.map(w => w === 0 ? 'цей' : '-' + w), series: [{ name: 'Закрито', color: 'var(--accent)', values: w8.map(w => weekStats(TODAY, w * 7).closed) }], h: 130 });
  const energyPts = days14.filter(k => HIST[k]?.energy).map(k => ({ d: k, v: +HIST[k].energy }));
  // habits %
  const habRows = S.habits.map(h => { let n = 0, d = 0; days14.forEach(k => { if (HIST[k]) { d++; if (HIST[k].habits?.[h]) n++; } }); const p = d ? n / d : 0; return `<div class="hbar" data-tip="${esc(h + ': ' + n + ' з ' + d + ' днів')}"><span>${esc(h)}</span><div class="tr"><div style="width:${(p * 100).toFixed(0)}%"></div></div><b>${Math.round(p * 100)}%</b></div>`; }).join('');
  // heat 4 weeks
  const end = new Date(TODAY + 'T12:00:00'); const dow = (end.getDay() + 6) % 7;
  const start = addDays(TODAY, -dow - 21);
  let cells = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'].map(w => `<div class="wd">${w}</div>`).join('');
  for (let i = 0; i < 28; i++) { const k = addDays(start, i), fut = k > TODAY, x = HIST[k]; cells += `<div class="${fut ? '' : 'l' + dayLevel(x)} ${k === TODAY ? 'today' : ''}" style="${fut ? 'opacity:.35' : ''}" data-tip="${esc(dmyy(k) + (x ? `\nзакрито ${(x.top3 || []).filter(t => t.done && t.t).length}/3 · кайдзен ${x.kaizen?.done ? '✓' : '—'}` : '\nнемає записів'))}"></div>`; }
  let streak = 0; let sd = D.kaizen.done ? TODAY : YESTERDAY;
  while (HIST[sd]?.kaizen?.done) { streak++; sd = addDays(sd, -1); }
  // horizon
  const nmt = new Date(S.nmtDate + 'T09:00:00');
  const left = Math.max(0, Math.ceil((nmt - now) / 864e5));
  const span0 = new Date('2026-09-01T00:00:00');
  const nmtPct = clamp((now - span0) / (nmt - span0) * 100, 2, 100);
  const nmtTopics = A.nmt ? areaTopics(A.nmt) : [];
  const nmtDone = nmtTopics.filter(t => t.s >= 1).length;
  const y0 = new Date(now.getFullYear(), 0, 1), y1 = new Date(now.getFullYear() + 1, 0, 1);
  const yPct = (now - y0) / (y1 - y0) * 100;
  return `<div class="stack view">
    <section class="card hero">
      <div class="eyebrow">Чи я ближче, ніж минулого тижня?</div>
      <div class="verdict ${vClass}">${vText}</div>
      <p class="rule">${b.any ? 'Останні 7 днів (ліва колонка) проти 7 днів перед ними. Слово рахується з чисел, а не обирається.' : 'Порівнювати ще нема з чим. Закривай кожен день, і через тиждень тут зʼявиться вердикт.'}</p>
      <div class="mrows">${rows}</div>
    </section>
    <section class="card"><div class="eyebrow">Хвилини навчання · 14 днів</div>${legend([['English', col(1), 1], ['НМТ', col(2), 1]])}${minutes}</section>
    <section class="card"><div class="eyebrow">Закрито задач по тижнях</div>${closedW}</section>
    <section class="card"><div class="eyebrow">Повторення тем · 14 днів <span class="num">${a.reviews} за тиждень</span></div>${revs}</section>
    <section class="card"><div class="eyebrow">Енергія · 14 днів</div>${energyPts.length ? lineChart({ series: [{ name: 'Енергія', color: col(7), pts: energyPts }], yMin: 0, yMax: 100, x0: days14[0], x1: TODAY }) : '<p class="empty">Обирай енергію щоранку, і тут буде видно, коли ти вигораєш.</p>'}</section>
    <section class="card"><div class="eyebrow">Звички · 14 днів</div>${habRows}</section>
    <section class="card">
      <div class="eyebrow">Останні 4 тижні <span class="num">кайдзен-серія: ${streak} дн.</span></div>
      <div class="heat">${cells}</div>
      <div class="legend">менше <i></i><i class="l1" style="background:var(--s1)"></i><i style="background:var(--s2)"></i><i style="background:var(--s4)"></i> більше · кайдзен + закриті задачі</div>
    </section>
    <section class="card">
      <div class="kv"><span>НМТ · ${nmt.getDate()} ${MONTHS[nmt.getMonth()]} ${nmt.getFullYear()}</span><span class="big">${left}<span class="muted" style="font-size:14px;font-weight:500"> дн.</span></span></div>
      <div class="pbar"><div style="width:${nmtPct.toFixed(1)}%"></div></div>
      <div class="kv"><span>Теми НМТ на 80%+</span><span class="muted" style="font-family:var(--mono)">${nmtDone} / ${nmtTopics.length}</span></div>
      <div class="pbar"><div style="width:${nmtTopics.length ? (nmtDone / nmtTopics.length * 100).toFixed(1) : 0}%;background:${col(2)}"></div></div>
      <div class="kv"><span>Рік ${now.getFullYear()}</span><span class="muted" style="font-family:var(--mono)">${yPct.toFixed(0)}%</span></div>
      <div class="pbar"><div style="width:${yPct.toFixed(1)}%"></div></div>
    </section>
  </div>`;
}

/* ================= render & routing ================= */
const TAB_OF = r => r.startsWith('goal:') ? 'dreams' : r.startsWith('area:') ? 'reviews' : r === 'evening' ? 'day' : r;
const SUB = r => r.includes(':') || r === 'evening';
function go(r) { route = r; try { localStorage.setItem('pult:route', r); } catch {} if (r === 'kaizen' && D.kaizen.done) kStep = 9; render(); window.scrollTo({ top: 0 }); }
function render() {
  hideTip();
  const sub = SUB(route);
  $('#back').hidden = !sub;
  let title = (TODAY && ['неділя', 'понеділок', 'вівторок', 'середа', 'четвер', 'пʼятниця', 'субота'][now.getDay()] + ', ' + now.getDate() + ' ' + ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'][now.getMonth()]);
  let crumb = 'Пульт';
  if (route.startsWith('goal:')) { const sp = G.spheres.find(s => s.id === route.slice(5)); title = sp ? sp.name : title; crumb = 'Мрії'; }
  else if (route.startsWith('area:')) { const a = A[route.slice(5)]; title = a ? a.name : title; crumb = "Рев'ю"; }
  else if (route === 'evening') { title = 'Вечір'; crumb = 'День'; }
  $('#date').textContent = title.replace(/^./, c => c.toUpperCase());
  $('#crumb').textContent = crumb;
  $('#mission').hidden = sub || route !== 'day';
  $('#mission').innerHTML = `<b>Місія.</b> ${esc(S.mission)}`;
  const tab = TAB_OF(route);
  $$('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  let html;
  if (route.startsWith('goal:')) html = vGoal(route.slice(5));
  else if (route.startsWith('area:')) html = vArea(route.slice(5));
  else html = ({ day: vDay, dreams: vDreams, reviews: vReviews, progress: vProgress, kaizen: vKaizen, evening: vEvening }[route] || vDay)();
  $('#view').innerHTML = html;
  fixLinks($('#view'));
  animateRings();
  if (route === 'day' && timer) tick();
  if (celebrate && route === 'goal:' + celebrate.id) {
    const br = $('#bigring'); if (br) { const f = document.createElement('div'); f.className = 'float'; f.textContent = (celebrate.delta > 0 ? '+' : '') + celebrate.delta; br.appendChild(f); if (celebrate.delta > 0) burst(br); }
    celebrate = null;
  }
}

/* ================= timer ================= */
function tick() {
  if (!timer) { clearInterval(tickH); tickH = null; return; }
  const total = timer.mins * 60, el = (Date.now() - timer.start) / 1000, left = total - el;
  const lt = $('#tleft'), rb = $('#rbar'), ring = $('#ring'), lab = $('#tlabel'), th = $('#thint');
  if (lt) {
    const a = Math.abs(Math.round(left));
    lt.textContent = (left < 0 ? '+' : '') + pad(Math.floor(a / 60)) + ':' + pad(a % 60);
    rb.style.strokeDashoffset = String(326.7 * Math.min(1, Math.max(0, el / total)));
    ring.classList.toggle('over', left < 0);
    lab.textContent = timer.kind === 'break' ? 'перерва 15 хв' : '45 хв роботи';
    if (left < 0) th.textContent = timer.kind === 'break' ? 'Перерва закінчилась. Наступний контейнер.' : 'Блок закінчився → закрий його. Залишок стає карткою на дошці.';
  }

}

/* ================= fx: particle burst ================= */
function burst(el) {
  if (RM) return;
  const cv = $('#fx'), ctx = cv.getContext('2d'); const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const r = el ? el.getBoundingClientRect() : { left: innerWidth / 2 - 20, top: innerHeight - 200, width: 40, height: 40 };
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const cs = getComputedStyle(document.documentElement);
  const colors = [1, 2, 3, 4, 5, 7].map(i => cs.getPropertyValue('--c' + i).trim());
  const P = Array.from({ length: 46 }, () => { const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5; return { x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, c: colors[Math.floor(Math.random() * colors.length)], w: 4 + Math.random() * 4 }; });
  let raf; const step = () => {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = false;
    P.forEach(p => { if (p.life <= 0) return; alive = true; p.x += p.vx; p.y += p.vy; p.vy += .18; p.life -= .018; ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.w, p.w * .6); });
    if (alive) raf = requestAnimationFrame(step); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  cancelAnimationFrame(raf); step();
}

    case 'saveLog': case 'plusOne': {
      const sp = G.spheres.find(s => s.id === el.dataset.id); const old = sphereVals(sp).cur;
      const v = act === 'plusOne' ? old + 1 : +$('#lg-v').value;
      if (isNaN(v)) { toast('Введи число.'); break; }
      const last = sp.log[sp.log.length - 1];
      if (last && last.d === TODAY) last.v = v; else sp.log.push({ d: TODAY, v });
      sp.log = sp.log.slice(-200);
      saveGoals(); closeSheet(); celebrate = { id: sp.id, delta: Math.round((v - old) * 100) / 100 };
      if (v > old) toast(`▲ ${sp.name}: ${Math.round(sphereVals(sp).pct * 100)}% до мрії`, true);
      render(); break;
    }
    case 'ms': { const sp = G.spheres.find(s => s.id === el.dataset.id); sp.ms[i].done = !sp.ms[i].done; saveGoals(); render(); if (sp.ms[i].done) { toast('Етап пройдено ▲', true); burst(el); } break; }
    case 'addMs': { const sp = G.spheres.find(s => s.id === el.dataset.id); const t = $('#msNew').value.trim(); if (!t) break; sp.ms.push({ t, done: false }); saveGoals(); render(); break; }
    /* reviews */
    case 'rev': case 'revS': {
      const ok = el.dataset.ok === '1'; const f = review(el.dataset.t, ok);
      if (act === 'revS') closeSheet();
      if (ok && !RM) { const row = $('#row-' + el.dataset.t); if (row) row.classList.add('flash-ok'); }
      if (!ok) toast(`«${f.t.n}» — назад у план. Це не провал, так працює реєстр.`);
      else if (!$('.toast.up')) toast(`✓ ${f.a.labels[f.t.s]} · наступна ${f.t.s >= 4 ? '— закріплено' : dmy(f.t.next)}`);
      setTimeout(render, ok && !RM ? 380 : 0); break;
    }
    case 'topic': openTopic(el.dataset.t); break;
    case 'subj': subjSel[el.dataset.a] = el.dataset.s; render(); break;
    case 'addTopic': {
      const a = A[el.dataset.a]; const s = a.subjects.find(x => x.id === el.dataset.s); const n = $('#topicNew').value.trim(); if (!n) break;
      s.sections[s.sections.length - 1].topics.push(mkTopics([n])[0]); saveArea(a); render(); break;
    }
    case 'delTopic': if (armed('dt', el, 'Точно видалити? Натисни ще раз')) { const f = findTopic(el.dataset.t); f.sec.topics = f.sec.topics.filter(t => t !== f.t); saveArea(f.a); closeSheet(); render(); } break;
    case 'addMock': openMock(); break;
    case 'saveMock': {
      const m = { d: $('#mk-d').value || TODAY }; let any = false;
      ['ua', 'math', 'hist', 'en'].forEach(k => { const v = $('#mk-' + k).value.trim(); m[k] = v === '' ? '' : clamp(+v, 0, 100); if (v !== '') any = true; });
      if (!any) { toast('Введи хоча б один відсоток.'); break; }
      A.nmt.mocks.push(m); saveArea(A.nmt); closeSheet(); render(); toast('Імітацію записано.'); break;
    }
    case 'newArea': openNewArea(); break;
    case 'saveArea': {
      const name = $('#na-name').value.trim(); if (!name) { $('#na-name').focus(); toast('Дай області назву.'); break; }
      const secs = []; let cur = null;
      $('#na-topics').value.split('\n').map(s => s.trim()).filter(Boolean).forEach(l => { if (l.startsWith('#')) { cur = { n: l.replace(/^#+\s*/, '') || 'Теми', topics: [] }; secs.push(cur); } else { if (!cur) { cur = { n: 'Теми', topics: [] }; secs.push(cur); } cur.topics.push(mkTopics([l])[0]); } });
      if (!secs.length) secs.push({ n: 'Теми', topics: [] });
      const id = 'a' + uid();
      A[id] = { kind: 'rev', id, name, order: 10 + Object.keys(A).length, folder: $('#na-folder').value.trim(), labels: ['Не почато', 'Вивчив', '+1 тиж ✓', '+1 міс ✓', 'Закріплено'], learn: 'Вивчив', pass: 'Памʼятаю', fail: 'Забув', subjects: [{ id: 's1', name, c: 1, sections: secs }], mocks: null };
      saveArea(A[id]); closeSheet(); go('area:' + id); break;
    }
    case 'delArea': if (armed('da', el, 'Точно видалити область? Натисни ще раз')) { Store.remove('rev-' + el.dataset.a); delete A[el.dataset.a]; go('reviews'); } break;
  }
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  try {
    const j = JSON.parse(await e.target.files[0].text());
    if (j.app !== 'pult' || !j.data) throw new Error('bad');
    Object.entries(j.data).forEach(([k, v]) => localStorage.setItem(k, v));
    toast('Дані відновлено.'); closeSheet(); await load(); render();
  } catch { toast('Це не файл копії Пульта.'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ================= boot ================= */
async function load() {
  const s = await Store.get('settings');
  if (s) S = Object.assign(clone(DEFAULTS), s);
  // v1 → v2: bring in apps and habits the earlier version didn't have
  if (s && !s.v2) {
    S.apps = DEFAULTS.apps.slice(); if (!S.habits.includes('⚽ Футбол')) S.habits.splice(S.habits.length - 1, 0, '⚽ Футбол');
    S.v2 = true; saveSettings();
  }
  if (!s) S.v2 = true;
  if (S.board === 'Area/Scrum/2 Дошки/Дошка виконання — поточний місяць') { S.board = DEFAULTS.board; saveSettings(); }
  const g = await Store.get('goals');
  if (g) G = Object.assign(clone(DEF_GOALS), g);
  if (s && s.goals && !g) { /* v1 kept goals as plain names; spheres replace them */ }
  let d = await Store.get('day-' + TODAY);
  if (!d && Store.mode === 'cloud') { const loc = lsGet('day-' + TODAY); if (loc) { d = loc; Store.save('day-' + TODAY, loc, true); } }
  D = normDay(d, TODAY);
  if (!d) { const y = await Store.get('day-' + YESTERDAY); (y?.evening?.tomorrow || []).forEach((t, i) => { if (t && i < 3) D.top3[i].t = t; }); }
  const list = await Store.list('day', 'day-');
  HIST = {}; list.forEach(x => { if (x && x.date) HIST[x.date] = x; });
  HIST[TODAY] = D;
  const revs = await Store.list('rev', 'rev-');
  A = {}; revs.forEach(r => { if (r && r.id) A[r.id] = r; });
  const def = defaultAreas();
  ['nmt', 'books'].forEach(k => { if (!A[k]) { A[k] = def[k]; if (Store.mode === 'cloud' || !lsGet('rev-' + k)) saveArea(A[k]); } });
  if (D.kaizen.done && route === 'kaizen') kStep = 9;
}
(async () => {
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch {}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  await load(); render(); setSync('local');
  await Store.init();
  if (Store.mode === 'cloud') { await load(); render(); setSync('cloud'); }
})();
})();
</script>
