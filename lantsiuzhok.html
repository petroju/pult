<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Ланцюжок слів</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one screen, three bands: the word to find, a tray of round picture tiles, a numbered chain of slots. */
:root{
  color-scheme: dark;
  --bg-top:#1d2a6b; --bg-low:#3a2a7a; --glow:#6f7dff; --tile:#ffffff; --tile-edge:#cfd6ff;
  --ink:#232a52; --paper:#fffaf0; --sun:#ffd84d; --k:#ff7a1a; --good:#35c97a; --bad:#ff5468;
  --panel:rgba(18,22,60,.78); --slot:rgba(255,255,255,.14); --line:rgba(255,216,77,.55);
  --display:"Balsamiq Sans","Comic Sans MS","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg-low);color:var(--paper);font-family:var(--body);font-weight:600;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
#stage{position:relative;height:100%;overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,rgba(111,125,255,.45),transparent 60%),linear-gradient(var(--bg-top),var(--bg-low))}
#sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--paper);opacity:.55;animation:tw 3.5s ease-in-out infinite}
@keyframes tw{50%{opacity:.12}}
#game{position:absolute;inset:0;display:flex;flex-direction:column;gap:clamp(8px,2vh,18px);box-sizing:border-box;overflow-y:auto;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.task{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:999px;padding:6px 8px 6px 20px;min-width:0;
  font-size:clamp(15px,2.4vw,20px)}
.task b{font-family:var(--display);font-size:clamp(26px,6vw,44px);line-height:1.05;color:var(--paper);text-transform:uppercase;letter-spacing:.03em;
  overflow-wrap:anywhere}
.task b u,.card h1 b,#word u{text-decoration:none;color:var(--k)}
.round-btn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-size:20px;cursor:pointer;
  display:grid;place-items:center;font-family:var(--body);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.round-btn:focus-visible,.big:focus-visible,.ghost:focus-visible,.tile:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

#tray{flex:1 1 auto;display:flex;flex-wrap:wrap;gap:clamp(8px,1.6vw,16px);justify-content:center;align-content:center;min-height:0}
.tile{--d:clamp(64px,min(15vw,17vh),118px);width:var(--d);height:var(--d);border-radius:50%;border:0;padding:0;cursor:pointer;
  background:var(--tile);box-shadow:0 5px 0 var(--tile-edge),0 0 0 4px rgba(255,255,255,.22);display:grid;place-items:center;transition:scale .12s}
.tile:active{scale:.94}
.tile svg,.slot svg,.fly svg{width:64%;height:64%;display:block;pointer-events:none}
.tile.gone{visibility:hidden}
.tile.no{animation:shake .35s}
@keyframes shake{20%{translate:-7px 0}40%{translate:7px 0}60%{translate:-5px 0}80%{translate:5px 0}}

#chain{flex:none;display:flex;flex-wrap:wrap;gap:clamp(6px,1.2vw,12px);justify-content:center;position:relative;padding-bottom:4px}
.slot{--d:clamp(50px,min(12.5vw,13vh),88px);width:var(--d);height:var(--d);border-radius:50%;position:relative;display:grid;place-items:center;
  background:var(--slot);border:3px dashed rgba(255,255,255,.35);box-sizing:border-box;
  font-family:var(--display);font-weight:700;font-size:calc(var(--d)*.38);color:rgba(255,250,240,.7);font-variant-numeric:tabular-nums}
.slot.now{border-color:var(--sun);border-style:solid;animation:pulse 1.2s ease-in-out infinite}
.slot.now svg{opacity:.38}
.slot.done{background:var(--tile);border:3px solid var(--good)}
.slot .n{position:absolute;left:-4px;top:-4px;width:22px;height:22px;border-radius:50%;background:var(--sun);color:var(--ink);
  font-family:var(--body);font-weight:800;font-size:12px;display:grid;place-items:center}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,216,77,.28)}}
.fly{position:fixed;z-index:20;border-radius:50%;background:var(--tile);display:grid;place-items:center;pointer-events:none}

#word{position:absolute;z-index:15;left:50%;top:44%;translate:-50% -50%;background:var(--paper);color:var(--ink);
  font-family:var(--display);font-weight:700;font-size:clamp(40px,10vw,80px);padding:.1em .5em .18em;border-radius:24px;
  box-shadow:0 8px 0 rgba(0,0,0,.3);pointer-events:none;white-space:nowrap}

.screen{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(18,22,60,.6);overflow-y:auto;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{max-width:440px;width:100%;box-sizing:border-box;text-align:center;background:var(--panel);border-radius:28px;padding:26px 24px;
  display:flex;flex-direction:column;gap:14px;align-items:center}
.card h1{margin:0;font-family:var(--display);font-size:clamp(34px,9vw,52px);line-height:1.05;color:var(--sun);text-wrap:balance}
.card p{margin:0;font-size:18px;line-height:1.45}
.card small{font-size:12px;opacity:.7;line-height:1.4}
.big{font-family:var(--display);font-weight:700;font-size:26px;border:0;border-radius:999px;padding:14px 44px;cursor:pointer;
  background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #c99a12}
.big:active{translate:0 3px;box-shadow:0 2px 0 #c99a12}
.ghost{font-family:var(--body);font-weight:800;font-size:18px;color:var(--paper);background:none;border:2px solid rgba(255,250,240,.45);
  border-radius:999px;padding:10px 28px;cursor:pointer}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.letters label{cursor:pointer}
.letters input{position:absolute;opacity:0}
.letters span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:rgba(255,250,240,.14);
  border:2px solid rgba(255,250,240,.45);font-family:var(--display);font-weight:700;font-size:30px;line-height:1}
.letters input:checked+span{background:var(--k);border-color:var(--k);scale:1.12}
.letters input:focus-visible+span{outline:3px solid var(--sun);outline-offset:2px}
#starsOut{font-size:56px;letter-spacing:6px;color:var(--sun)}
#starsOut .off{opacity:.25}
@media (prefers-reduced-motion:reduce){#sky i,.slot.now{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div id="game" hidden>
    <div class="bar">
      <button class="round-btn" id="home" type="button" aria-label="У меню">⌂</button>
      <div class="task"><span>Знайди</span><b id="target"></b>
        <button class="round-btn" id="say" type="button" aria-label="Послухати слово" hidden>🔊</button></div>
      <button class="round-btn" id="mute" type="button" aria-label="Вимкнути звук">♪</button>
    </div>
    <div id="tray"></div>
    <div id="chain"></div>
  </div>
  <div id="word" hidden></div>

  <div class="screen" id="startScreen">
    <div class="card">
      <h1>Ланцюжок слів на <b id="bigL">Р</b></h1>
      <p>Обери букву. Знайди картинку, назви слово вголос і склади ланцюжок із десяти слів.</p>
      <div class="letters" role="radiogroup" aria-label="Буква">
        <label><input type="radio" name="letter" id="lR" value="р" checked><span>Р</span></label>
        <label><input type="radio" name="letter" id="lK" value="к"><span>К</span></label>
        <label><input type="radio" name="letter" id="lL" value="л"><span>Л</span></label>
        <label><input type="radio" name="letter" id="lP" value="п"><span>П</span></label>
        <label><input type="radio" name="letter" id="lG" value="г"><span>Г</span></label>
        <label><input type="radio" name="letter" id="lF" value="ф"><span>Ф</span></label>
      </div>
      <button class="big" id="play" type="button">Грати</button>
      <small>Картинки: Twemoji © Twitter, Inc. та інші автори, ліцензія CC BY 4.0</small>
    </div>
  </div>
  <div class="screen" id="endScreen" hidden>
    <div class="card">
      <h1 id="endTitle">Молодець!</h1>
      <div id="starsOut" aria-hidden="true"></div>
      <p id="endText"></p>
      <button class="big" id="again" type="button">Ще раз</button>
      <button class="ghost" id="menu2" type="button">У меню</button>
    </div>
  </div>
</div>
